name: Native platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            os: ubuntu-24.04
          - platform: macOS Apple Silicon
            os: macos-14
          - platform: macOS Intel
            os: macos-15-intel
          - platform: Windows x86-64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          modules: "qtmultimedia qtquick3d qtshadertools qtwebengine"
          cache: true

      - name: Test gem, catalog, native host, and runtime
        run: ruby scripts/ci.rb

      - name: Preserve native verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zui-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            tmp/ci-host/**
            tmp/gems/*.gem
            tmp/runtime-smoke-*.log
