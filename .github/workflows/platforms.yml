name: Native platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            os: ubuntu-22.04
          - platform: macOS Apple Silicon
            os: macos-14
          - platform: macOS Intel
            os: macos-15-intel
          - platform: Windows x86-64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"

      - name: Install Linux distribution tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Install Windows distribution tools
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          modules: "qtmultimedia qtquick3d qtquicktimeline qtshadertools"
          cache: true

      - name: Test gem, catalog, native host, and runtime
        run: ruby scripts/ci.rb

      - name: Preserve native verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zui-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            tmp/clients/**
            tmp/gems/*.gem
            tmp/runtime-smoke-*.log

  release-clients:
    name: Tag release and publish native clients
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' lib/zui.rb)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid Zui version: $version" >&2
            exit 1
          }
          tag="v$version"
          remote_commit=$(git ls-remote origin "refs/tags/$tag^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$remote_commit" ]; then
            remote_commit=$(git ls-remote origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')
          fi

          if [ -z "$remote_commit" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "Zui $version"
            git push origin "$tag"
            release=true
          elif [ "$remote_commit" = "$GITHUB_SHA" ]; then
            release=true
          else
            echo "Tag $tag already points to $remote_commit; current commit is $GITHUB_SHA. Skipping release."
            release=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Download verified platform artifacts
        if: steps.release.outputs.release == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: zui-*
          path: release-assets
          merge-multiple: true

      - name: Create release and attach client archives
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Zui $RELEASE_VERSION" --generate-notes --target "$GITHUB_SHA"
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -print0 |
            xargs -0 gh release upload "$RELEASE_TAG" --clobber
